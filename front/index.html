<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatBot Escuela Técnica</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon.png" type="image/png">

    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">🤖 Asistente de Trámites Escolares</div>
            <div class="chat-box" id="chatBox">
                <div class="message bot-message">¡Hola! Soy el asistente virtual...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escribí tu pregunta..." autocomplete="off">
                <button id="sendBtn" onclick="enviarMensaje()">Enviar</button>
            </div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
